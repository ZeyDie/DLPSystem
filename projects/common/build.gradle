plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation project(':projects:api')

    // https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-cache
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-cache', version: "${boot}"

    // https://mvnrepository.com/artifact/com.github.ben-manes/caffeine
    implementation group: 'com.github.ben-manes.caffeine', name: 'caffeine', version: "${caffeine}"
}