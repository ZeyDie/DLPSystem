spring:
  datasource:
    url: jdbc:h2:file:./data/dev;AUTO_RECONNECT=TRUE;MODE=PostgreSQL;
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
     enabled: true
     path: /h2-console
app:
  version: ${APP_VERSION}-dev
  csrf:
    enabled: false
  ldap:
    enabled: false

logging:
  level:
    com.zeydie: INFO
    org.hibernate: INFO
    org.springframework: INFO