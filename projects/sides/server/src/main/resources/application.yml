spring:
  profiles:
    active: ${PROFILE}
  config:
    import: optional:file:.env[.properties]

  application:
    name: ${APP_NAME}

  cache:
    type: caffeine
  datasource:
    url: ${JDBC_URL}
    username: ${JDBC_USERNAME}
    password: ${JDBC_PASSWORD}
    driver-class-name: ${JDBC_DRIVER}
  jpa:
    show-sql: ${DB_SHOW_SQL}
    hibernate:
      ddl-auto: ${DB_DDL_AUTO}
    properties:
      hibernate.dialect: ${DB_DIALECT}

server:
  port: ${PORT:8080}

app:
  version: ${APP_VERSION}
  cors:
    enabled: ${CORS_ENABLED:false}
    allowed:
      credentials: ${CORS_ALLOWED_CREDENTIALS:false}
      origins: ${CORS_ALLOWED_ORIGINS:null}
      headers: ${CORS_ALLOWED_HEADERS:null}
      methods: ${CORS_ALLOWED_METHODS:null}
  csrf:
      enabled: ${CSRF_ENABLED:false}
  ldap:
    enabled: ${LDAP_ENABLED:false}
    url: ${LDAP_URL}
    base: ${LDAP_BASE}
    username: ${LDAP_USERNAME}
    password: ${LDAP_PASSWORD}
    domain: ${LDAP_DOMAIN}
    path:
      pc: ${LDAP_PATH_PC}
      users: ${LDAP_PATH_USERS}