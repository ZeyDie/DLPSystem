plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation project(':projects:api')
    implementation project(':projects:common')

    // https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-data-ldap
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-data-ldap', version: "${boot}"

    // https://mvnrepository.com/artifact/org.springframework.security/spring-security-config
    implementation group: 'org.springframework.security', name: 'spring-security-config', version: "${security}"
    // https://mvnrepository.com/artifact/org.springframework.security/spring-security-ldap
    implementation group: 'org.springframework.security', name: 'spring-security-ldap', version: "${security}"

    // https://mvnrepository.com/artifact/org.springframework.security/spring-security-kerberos-core
    //implementation group: 'org.springframework.security', name: 'spring-security-kerberos-core', version: "${security}"
    // https://mvnrepository.com/artifact/org.springframework.security/spring-security-kerberos-web
    //implementation group: 'org.springframework.security', name: 'spring-security-kerberos-web', version: "${security}"
}