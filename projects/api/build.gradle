plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

dependencies {
    // https://mvnrepository.com/artifact/org.springframework.security/spring-security-core
    implementation group: "org.springframework.security", name: "spring-security-core", version: "${security}"
    // https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-validation
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-validation', version: "${boot}"
}